<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows 11 Clone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="desktop">
        <div class="desktop-icon">
            <img src="assets/this-pc.png" alt="This PC">
            <span>This PC</span>
        </div>
        <div class="desktop-icon">
            <img src="assets/recycle-bin.png" alt="Recycle Bin">
            <span>Recycle Bin</span>
        </div>
    </div>
    <div class="taskbar">
        <div class="start-menu-button"></div>
        <div class="taskbar-icon">
            <img src="assets/file-explorer.png" alt="File Explorer">
        </div>
        <div class="taskbar-icon">
            <img src="assets/microsoft-edge.png" alt="Microsoft Edge">
        </div>
        <div class="taskbar-icon">
            <img src="assets/microsoft-store.png" alt="Microsoft Store">
        </div>
    </div>
    <div class="start-menu hidden">
        <div class="search-bar">
            <input type="text" placeholder="Search">
        </div>
        <div class="pinned-apps">
            <!-- Pinned apps icons will go here -->
        </div>
        <div class="recommended-items">
            <h2>Recommended</h2>
            <!-- Recommended items will go here -->
        </div>
        <div class="start-menu-footer">
            <div class="user-profile"></div>
            <div class="power-button"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
